<!DOCTYPE html>
<html lang="PT-BR">
<head>
	<script>
		let = semestreAtual = "2026.1";
	</script>
	<meta charset="UTF-8">
	<link rel="stylesheet" type="text/css" href="estilo.css">
	<title><script>document.write(semestreAtual)</script></title>
	<link href="favicon.ico" rel="icon">
  	<link href="favicon.ico" rel="apple-touch-icon">
</head>
<body>
	<div class="center">
		<h1><span id="semestre-atual"><script>document.write(semestreAtual)</script></span><br>Contador para o final do semestre. <br>Estamos em <span class="data-atual"></span> </h1>
		<div id="clock">
			
		</div>
	</div>
	<script type="text/javascript" src="jquery-2.0.0.js"></script>
	<script type="text/javascript" src="countdown.js"></script>
<script type="text/javascript">
    $('#clock').countdown('2026/07/07', function(event) {
        var dias = event.offset.totalDays;              // Dias totais restantes
        var semanas = Math.floor(dias / 7);              // Semanas completas
        var horas = event.offset.hours;
        var minutos = event.offset.minutes;
        var segundos = event.offset.seconds;

        // Textos dinâmicos no singular/plural
        var semanasTexto = semanas === 1 ? 'Semana' : 'Semanas';
        var diasTexto = dias === 1 ? 'Dia' : 'Dias'; 
        var horasTexto = horas === 1 ? 'Hora' : 'Horas';
        var minutosTexto = minutos === 1 ? 'Minuto' : 'Minutos';
        var segundosTexto = segundos === 1 ? 'Segundo' : 'Segundos';

        // Gerar HTML
        $(this).html(event.strftime(''
            + '<div><span>' + semanas + '</span> ' + semanasTexto + '</div>'
            + '<div><span>' + dias + '</span> ' + diasTexto + '</div>'
            + '<div><span>%H</span> ' + horasTexto + '</div>'
            + '<div><span>%M</span> ' + minutosTexto + '</div>'
            + '<div><span>%S</span> ' + segundosTexto + '</div>'
        ));
    });
</script>


	<script>
        $(document).ready(function() {
            var dataAtual = new Date();
            var dia = ("0" + dataAtual.getDate()).slice(-2);
            var mes = ("0" + (dataAtual.getMonth() + 1)).slice(-2); // Mes começa do 0, então somamos 1
            var ano = dataAtual.getFullYear();
            var dataFormatada = dia + "/" + mes + "/" + ano;

            $(".data-atual").text(dataFormatada);
        });
    </script>
</body>
</html>
